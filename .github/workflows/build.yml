name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
env:
  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
  AUTH0_E2E_EMAIL: ${{ secrets.AUTH0_E2E_EMAIL }}
  AUTH0_E2E_PASSWORD: ${{ secrets.AUTH0_E2E_PASSWORD }}
  VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
  VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
  VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: e2e    # use the "e2e" environment so its vars/secrets are available
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: true

      - name: Build Lambda functions
        run: cd functions && mvn package -B

      - name: Test Lambda functions
        run: cd functions && mvn test -B

      - name: Test CDK infra
        run: cd infra && mvn test -B

      - name: Set up Node (for CDK)
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK synth (test env)
        run: |
          cd infra
          mvn compile -B
          : "${AUTH0_DOMAIN:?AUTH0_DOMAIN GitHub variable is required for CDK synth}"
          : "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE GitHub variable is required for CDK synth}"
          cdk synth -c env=test -c auth0Domain="${AUTH0_DOMAIN}" -c auth0Audience="${AUTH0_AUDIENCE}"

  e2e:
    needs: build
    runs-on: ubuntu-latest
    environment: e2e    # use the "e2e" environment so its vars/secrets are available
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium headless shell (attempt $attempt/3)..."
            if npx playwright install chromium --only-shell; then
              echo "Playwright Chromium ready"
              exit 0
            fi
            echo "Playwright install failed; clearing browser cache before retry"
            rm -rf "$HOME/.cache/ms-playwright"
            sleep 10
          done
          echo "Playwright install failed after 3 attempts"
          exit 1

      - name: Build backend for E2E
        run: mvn -q -Pe2e package -DskipTests

      - name: Start backend (E2E profile)
        run: |
          java -jar target/thankyouboard-*.jar --spring.profiles.active=e2e > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is up (attempt $i)"
              exit 0
            fi
            if [ -f backend.pid ] && ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "Backend process exited before becoming ready"
              echo "--- Backend log ---"
              cat backend.log || true
              exit 1
            fi
            echo "Waiting for backend... (attempt $i/60)"
            sleep 5
          done
          echo "Backend failed to start in time"
          echo "--- Backend log ---"
          cat backend.log || true
          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
            wait "$(cat backend.pid)" 2>/dev/null || true
          fi
          if [ -f backend.log ]; then
            echo "--- Backend log ---"
            cat backend.log
          fi
